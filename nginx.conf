server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Necesario para React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy interno hacia la API temporal de Docker Compose.
    location /api/ {
        proxy_pass http://secub-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.yaml {
        proxy_pass http://secub-api:3001/openapi.yaml;
        proxy_set_header Host $host;
    }

    # Cache para assets estáticos generados por Vite (tienen hash en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
